x-build: &build
  context: ../..
  dockerfile: examples/ai-sdk-linear-triage/Dockerfile

x-listening: &listening
  interval: 1s
  retries: 30

services:
  fake-linear:
    build: *build
    working_dir: /app/examples/ai-sdk-linear-triage/fake-linear
    command: ["/app/node_modules/.bin/tsx", "index.ts"]
    environment:
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      <<: *listening

  gateway:
    build: *build
    working_dir: /app/examples/ai-sdk-linear-triage/gateway
    command: ["/app/node_modules/.bin/tsx", "index.ts"]
    environment:
      SESSION_FILE: /shared/session
      LINEAR_UPSTREAM: http://fake-linear:4000
    volumes: [session:/shared]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8787, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      <<: *listening
    depends_on:
      fake-linear:
        condition: service_healthy

  harness:
    build: *build
    working_dir: /app/examples/ai-sdk-linear-triage/harness
    command: ["/app/node_modules/.bin/tsx", "index.ts"]
    # Same network namespace as the gateway: the Linear SDK only allows plain http to localhost.
    network_mode: service:gateway
    environment:
      SESSION_FILE: /shared/session
      # From `claude setup-token`, in harness/.env (pass with --env-file harness/.env)
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?put CLAUDE_CODE_OAUTH_TOKEN=... in harness/.env and run with --env-file harness/.env}
    volumes: [session:/shared:ro]
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  session:
