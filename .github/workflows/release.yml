name: Release

# Merging a version bump to main releases it: publish @waterlock/gateway@<version> to npm,
# then create the GitHub release + tag v<version>. Nothing happens if that version is already
# done, so re-running is safe.
#
# npm auth is trusted publishing (OIDC): no npm token is stored, and npm attaches provenance.
# The GitHub release uses the built-in GITHUB_TOKEN. Releases created with it don't trigger
# other workflows, which is why publishing happens here and not on `release: published`.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the release + tag
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: What needs releasing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if gh release view "v$VERSION" >/dev/null 2>&1; then RELEASED=yes; else RELEASED=; fi
          # Prereleases (1.2.0-rc.1) go to the "next" dist-tag so `npm i` keeps getting the latest stable.
          case "$VERSION" in *-*) PRE=yes ;; *) PRE= ;; esac
          {
            echo "version=$VERSION"
            echo "publish=$([ -z "$PUBLISHED" ] && echo yes)"
            echo "release=$([ -z "$RELEASED" ] && echo yes)"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "$NAME@$VERSION: on npm=${PUBLISHED:-no}, github release=${RELEASED:-no}"

      - if: steps.plan.outputs.publish
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.publish
        run: pnpm typecheck
      - if: steps.plan.outputs.publish
        run: pnpm test
      - if: steps.plan.outputs.publish
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1.
      - if: steps.plan.outputs.publish
        run: npm install -g npm@11.6.2 && npm --version

      # --ignore-scripts: prepublishOnly would repeat the steps above.
      - name: Publish to npm
        if: steps.plan.outputs.publish
        env:
          DIST_TAG: ${{ steps.plan.outputs.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$DIST_TAG" --ignore-scripts

      # After npm, so a failed publish never leaves a tag pointing at an unreleased version.
      - name: Create GitHub release
        if: steps.plan.outputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRE: ${{ steps.plan.outputs.prerelease }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes ${PRE:+--prerelease}
