name: Release

# Publishing a GitHub release tagged vX.Y.Z publishes @waterlock/gateway@X.Y.Z to npm.
# Auth is npm trusted publishing (OIDC): no npm token is stored in this repo, and npm
# attaches provenance linking the package to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.6.2 && npm --version

      # Prereleases go to the "next" dist-tag so `npm i @waterlock/gateway` keeps getting the latest stable.
      # --ignore-scripts: prepublishOnly would repeat the steps above.
      - name: Publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$DIST_TAG" --ignore-scripts
